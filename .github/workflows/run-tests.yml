name: Run tests

on:
  workflow_call:
    inputs:
      install_command_linux:
        description: >-
          Install command for Linux, the only platform where every extra
          (bigwig included) installs cleanly.
        required: true
        type: string
      install_command_macos:
        description: >-
          Install command for macOS. It must omit the bigwig extra (pyBigWig
          has no reliable macOS wheel); the BiocPy stack builds from source
          there.
        required: true
        type: string
      install_command_windows:
        description: >-
          Install command for Windows. It must stay at core plus parquet:
          pyarrow ships Windows wheels, but neither pyBigWig nor the BiocPy
          ranged stack (iranges/genomicranges) does, and the latter fails to
          build from source. The anndata extra implies biocpy, so it is
          omitted too. BiocPy- and anndata-dependent tests skip there.
        required: true
        type: string

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (Linux)
        if: runner.os == 'Linux'
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          command: |
            python -m pip install --upgrade pip
            ${{ inputs.install_command_linux }}
          attempt_limit: 5
          attempt_delay: 10000
      - name: Install package (macOS)
        if: runner.os == 'macOS'
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          command: |
            python -m pip install --upgrade pip
            ${{ inputs.install_command_macos }}
          attempt_limit: 5
          attempt_delay: 10000
      - name: Install package (Windows)
        if: runner.os == 'Windows'
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          command: |
            python -m pip install --upgrade pip
            ${{ inputs.install_command_windows }}
          attempt_limit: 5
          attempt_delay: 10000
      - name: Run tests
        run: python -m pytest
