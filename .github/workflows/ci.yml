name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .

  tests:
    uses: ./.github/workflows/run-tests.yml
    with:
      install_command_linux: 'python -m pip install -e ".[dev,all]"'
      install_command_linux_without_anndata: >-
        python -m pip install -e ".[dev,bigwig,biocpy,parquet,pybiocfilecache]"
      install_command_macos: >-
        python -m pip install -e ".[dev,biocpy,parquet,anndata,pybiocfilecache]"
      install_command_macos_without_anndata: >-
        python -m pip install -e ".[dev,biocpy,parquet,pybiocfilecache]"
      install_command_windows: >-
        python -m pip install -e ".[dev,parquet,pybiocfilecache]"

  coverage:
    uses: ./.github/workflows/report-coverage.yml
    secrets: inherit
